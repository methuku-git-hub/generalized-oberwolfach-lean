name: Comparator memory diagnostic (not verification)
on:
  push:
    branches: [codex/comparator-memory-diagnostic-20261117]
permissions:
  contents: read
jobs:
  observe:
    name: Memory diagnosis only - no Palomar verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PALOMAR_EXECUTION_PROFILE: palomar-standard-v1
    steps:
      - name: Record start time
        run: echo "PALOMAR_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostic
          fetch-depth: 2
          persist-credentials: false
      - name: Check source identity
        run: |
          cd diagnostic
          test "$(git rev-parse HEAD^)" = c0d30d23c6c58dc41c03c9ce126e1ce1d846519a
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' .github/scripts/comparator_memory_diagnostic.py .github/workflows/comparator-memory-diagnostic.yml)"
          echo '## Instrumented diagnostic only, not a Palomar preflight or theorem verdict' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
          path: pipeline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: pipeline
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r pipeline/requirements.txt
      - name: Prepare the exact previously tested proof source
        id: prepare
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/pipeline/Gemfile
        run: |
          python - <<'PY'
          import json, os, pathlib
          inputs = {'repository': 'methuku-git-hub/generalized-oberwolfach-lean', 'commit': 'c0d30d23c6c58dc41c03c9ce126e1ce1d846519a', 'request_id': 'diagnostic01', 'mode': 'full', 'execution_profile': 'palomar-standard-v1', 'pipeline_commit': '14aa8d6b3c2f14a8540605e37144560b9a00e7e7', 'options': json.dumps({'comparator_config_path': 'comparator.json', 'authorization_relationship': 'I am a responsible author or maintainer'})}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'inputs.json').write_text(json.dumps({'inputs': inputs}))
          PY
          python pipeline/scripts/verify_submission.py prepare --event "$RUNNER_TEMP/inputs.json" --work-dir "$RUNNER_TEMP/palomar" --output "$RUNNER_TEMP/mechanical-report.json" --licensee "$(command -v bundle)"
          python -c 'import json,os,pathlib; r=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"mechanical-report.json").read_text()); assert r["status"] == "pending", r'
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - run: python pipeline/scripts/verify_submission.py check-capacity --disk-path "$RUNNER_TEMP" --output "$RUNNER_TEMP/mechanical-report.json"
      - name: Install pinned Lean
        run: |
          python3 pipeline/scripts/trusted_download.py --url https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/elan.tar.gz" --sha256 df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: elan toolchain install leanprover/lean4:v4.35.0
      - name: Build pinned sandbox helper
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config >/dev/null
          echo "PALOMAR_BWRAP=$(pipeline/scripts/install_bwrap.sh "$RUNNER_TEMP/bwrap-bin")" >> "$GITHUB_ENV"
      - name: Observe processes during the comparison
        run: python diagnostic/.github/scripts/comparator_memory_diagnostic.py
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: comparator-memory-diagnostic-not-verification
          path: |
            ${{ runner.temp }}/comparator-memory-diagnostic/
            ${{ runner.temp }}/mechanical-report.json
          if-no-files-found: warn
          retention-days: 14
