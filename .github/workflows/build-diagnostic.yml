name: Build resource diagnostic (not verification)

on:
  push:
    branches: [codex/oberwolfach-build-diagnostic-20261115]

permissions:
  contents: read

jobs:
  sample-build:
    name: Diagnostic sample — no theorem verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Confirm proof source matches the failed preflight
        shell: bash
        run: |
          git cat-file -e 5d242b7a7ecc79c47dfafb9d1ecdfecc6127dc6c^{commit}
          expected=$(printf '%s\n' '.github/scripts/profile_lake_build.py' '.github/workflows/build-diagnostic.yml')
          actual=$(git diff --name-only 5d242b7a7ecc79c47dfafb9d1ecdfecc6127dc6c HEAD | LC_ALL=C sort)
          test "$actual" = "$expected"
          echo '## Diagnostic only — not Palomar verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job samples build progress and memory; a successful diagnostic is not a theorem verdict.' >> "$GITHUB_STEP_SUMMARY"
      - name: Free disk space on the temporary runner
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz' \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  '"$RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Fetch the pinned Mathlib cache
        run: lake exe cache get
      - name: Sample build progress and memory
        env:
          DIAGNOSTIC_SOURCE_COMMIT: 5d242b7a7ecc79c47dfafb9d1ecdfecc6127dc6c
          DIAGNOSTIC_MAX_SECONDS: 16200
        run: python3 .github/scripts/profile_lake_build.py
      - name: Preserve diagnostic measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-diagnostic-not-verification
          path: ${{ runner.temp }}/oberwolfach-build-diagnostic/
          if-no-files-found: warn
          retention-days: 14
