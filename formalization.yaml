  statements:
    - source: "Manuscript theorem labelled thm:new:prescribed-factor"
      lean: "Oberwolfach.mainTheoremProof"
      module: "Oberwolfach.MainTheoremFromProtectedPreparation"
      status: "proved"
      note: >-
        The original main-theorem gate and independent kernel checks passed on
        a related source-stable local candidate. The exact prepared repository
        has not yet passed Palomar Comparator or its own full final verification.
